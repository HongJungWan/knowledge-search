plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hris'
version = '0.0.1-SNAPSHOT'
description = 'Knowledge Search (RAG) backend + MCP server for the settlement domain (Spring Boot)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 의존성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'   // ETL 적재 파이프라인 (PRD §7)

    // QueryDSL 의존성 (5.1.0 jakarta) — 동적 조건 조립 (PRD §6)
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'com.querydsl:querydsl-core:5.1.0'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Lombok 의존성
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DataBase 의존성
    implementation 'com.h2database:h2'           // local 프로필(in-memory) + redshift 프로필의 배치 메타테이블(BatchDataSourceConfig)
    runtimeOnly 'com.amazon.redshift:redshift-jdbc42:2.1.0.33'   // redshift 프로파일 datasource (application-redshift.yml)
    runtimeOnly 'org.postgresql:postgresql'      // postgres 프로파일(pgvector 하이브리드 검색) datasource

    // Flyway — postgres 프로파일 전용 스키마 마이그레이션(베이스/redshift 프로파일에서는 flyway.enabled=false).
    // H2(create-drop)·Redshift(scripts/redshift) 경로는 무영향.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // AWS SDK v2 — Glue Data Catalog 파티션 등록 (ETL 종료 시, PRD §4.2/§7)
    implementation platform('software.amazon.awssdk:bom:2.31.21')
    implementation 'software.amazon.awssdk:glue'
    implementation 'software.amazon.awssdk:bedrockruntime'   // BedrockEmbeddingProvider(@Profile("bedrock"), 향후)

    // 캐시 의존성 (metadata /resolve 결과 캐싱, PRD §6)
    implementation 'org.springframework.boot:spring-boot-starter-cache'   // CaffeineCacheManager 제공
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Swagger OpenAPI 의존성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Spring AI MCP Server (PRD §5/§12) — 1.0.0 확정. webmvc 스타터 = SSE 전송(/sse + /mcp/message).
    // Claude Code 연결은 레포 루트 .mcp.json. 1.1.x 업그레이드 시 streamable HTTP(/mcp) 전환 검토.
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.0')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // Testing 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit — DDD 헥사고날 구조 규칙 정밀 강제 (CI 권위 게이트)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// 소스/포크 JVM 인코딩을 UTF-8 로 고정 — 한글 시드(data.sql)/리터럴이 Windows 기본 charset(CP949)으로
// 깨지는 것을 막는다(Linux/CI 는 UTF-8 기본이라 무영향).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
