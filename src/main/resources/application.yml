# ===================================================================
# knowledge-search — 사내 지식 검색(RAG) 백엔드 + MCP 서버 (정산 도메인)
# 기본/LOCAL 프로필: H2 in-memory (외부 의존성 없음). AWS 미연결.
# 앱은 AWS 없이 부팅하고 MCP 도구를 H2 위에서 제공한다.
# ===================================================================

server:
  port: 8095
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: knowledge-search

  # --- SPRING AI MCP SERVER (PRD §5/§12) ---
  # webmvc 스타터 = SSE 전송. 기본 엔드포인트: /sse (메시지: /mcp/message).
  # Claude Code 연결 설정은 레포 루트 .mcp.json — README "Claude Code 연결하기" 참조.
  ai:
    mcp:
      server:
        name: knowledge-search
        version: 0.0.1

  # 기본 활성 프로필: local (H2 + 시드 데이터)
  profiles:
    active: local

  # --- DATASOURCE: H2 in-memory (기본/LOCAL) ---
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:knowledgedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # --- JPA/HIBERNATE ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop          # LOCAL: 부팅 시 스키마 생성, 종료 시 제거
    defer-datasource-initialization: true   # data.sql 시드를 엔티티 DDL 이후 실행
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        default_batch_fetch_size: 16

  # --- SQL INIT (data.sql 시드) ---
  sql:
    init:
      mode: always

  # --- FLYWAY ---
  # 베이스/LOCAL(H2)·redshift 프로파일에서는 끈다. Flyway 마이그레이션(db/migration, Postgres 문법)은
  # postgres 프로파일(application-postgres.yml)에서만 활성화한다. H2 는 create-drop, Redshift 는 scripts/redshift 가 관리.
  flyway:
    enabled: false

  # --- SPRING BATCH (ETL, PRD §7) ---
  batch:
    jdbc:
      initialize-schema: always      # 배치 메타데이터 스키마 생성 (H2)
    job:
      enabled: false                 # 부팅 시 자동 실행 안 함. /etl/run 으로 수동 트리거(PRD §7.2)

  # --- JACKSON/JSON ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    time-zone: UTC

# --- metadata-ontology 연동 (PRD §2/§6) ---
# 기본 OFF — 비활성 시 원본 질의를 그대로 쓰는 no-op 폴백.
# 운영은 application-redshift.yml 이 METADATA_BASE_URL 환경변수로 주입한다.
metadata:
  enabled: false
  base-url: http://localhost:8096

# --- 검색 계층 플래그 ---
# Spectrum 통합 뷰(knowledge_search_v) 조회 여부 — redshift 프로파일에서만 의미가 있다
# (RedshiftKnowledgeRecordRepositoryImpl 이 뷰/네이티브 테이블을 선택). local(H2) 경로는 참조하지 않는다.
search:
  spectrum:
    enabled: false
  # 청킹 검색(로드맵 #3) — postgres 프로파일에서만 의미. true 면 적재 시 청크 임베딩 생성 +
  # 벡터 arm 이 문서의 최상 청크로 랭킹(장문 희석 회피). 기본 false(통째-임베딩).
  chunking:
    enabled: false

# --- 임베딩 (하이브리드 검색 벡터 arm) ---
# dimension 은 pgvector 컬럼 vector(N) 과 반드시 일치해야 한다(부팅 시 검증). 기본 구현은 결정론적 해싱
# 스텁(HashingEmbeddingProvider) — 의미 없음, 배선/마이그레이션/RRF SQL 검증 전용. 실제 재현율 측정은
# localmodel 프로파일(Ollama 호환 HTTP, bge-m3) 또는 bedrock 프로파일(Titan v2). 셋 다 1024 차원으로 정렬.
embedding:
  dimension: 1024
  local:
    base-url: http://localhost:11434     # Ollama 기본. /api/embeddings 호출(localmodel 프로파일)
    model: bge-m3
  bedrock:
    model-id: amazon.titan-embed-text-v2:0   # bedrock 프로파일(향후)

# --- 리랭킹 (로드맵 #4) ---
# 기본 NoOp(재정렬 없음). llmrerank 프로파일에서 LlmJudgeReranker 활성 — Ollama 생성 모델로 후보를
# 리스트와이즈 재정렬해 의미 유사 문서를 변별한다. 모델은 한국어 특화 소형(EXAONE 3.5 2.4B) 기본.
rerank:
  base-url: http://localhost:11434
  model: exaone3.5:2.4b

# --- OpenSearch (로드맵 #6, opensearch 프로파일) ---
# BM25+k-NN 하이브리드 검색 백엔드(운영 타깃 데모). postgres 프로파일과 함께 활성하면 KnowledgeRecord
# 검색은 OpenSearch, SearchLog/배치는 Postgres 를 쓴다. (로컬: docker/docker-compose.opensearch.yml)
opensearch:
  url: http://localhost:9200
  # title/body 텍스트 분석기. 기본 standard. nori 이미지(docker-compose.opensearch-nori.yml)에선
  # OPENSEARCH_TEXT_ANALYZER=nori 로 한국어 형태소 분석 적용(조사/복합어 분해 → BM25 품질↑, 로드맵 #7).
  text-analyzer: standard

# --- ACTUATOR ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /management
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# --- SPRINGDOC / SWAGGER ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.hris.knowledgesearch

logging:
  level:
    root: INFO
    com.hris.knowledgesearch: INFO
    org.hibernate: WARN

# 운영(Redshift · Spectrum · Glue) 설정은 application-redshift.yml — 환경변수 주입, DDL 은 scripts/redshift/.
